name: Deploy to EC2

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify required secrets (safe)
        shell: bash
        run: |
          set -e
          [[ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]] || { echo "Missing AWS_ACCESS_KEY_ID"; exit 1; }
          [[ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]] || { echo "Missing AWS_SECRET_ACCESS_KEY"; exit 1; }
          [[ -n "${{ secrets.AWS_REGION }}" ]] || { echo "Missing AWS_REGION"; exit 1; }
          [[ -n "${{ secrets.EC2_INSTANCE_ID }}" ]] || { echo "Missing EC2_INSTANCE_ID"; exit 1; }
          echo "All required secrets are set"

      - name: Verify AWS credentials (safe)
        shell: bash
        run: |
          set -e
          aws sts get-caller-identity
          aws ec2 describe-instances --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ secrets.AWS_REGION }}" --query 'Reservations[].Instances[].InstanceId' --output text

      - name: Deploy on EC2 with SSM
        shell: bash
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions deploy for project-management-backend-nest" \
            --parameters 'commands=["runuser -l ubuntu -c \"set -e && source /home/ubuntu/.nvm/nvm.sh && cd /home/ubuntu/dev/project-management-backend-nest && git pull origin dev && npm i && rm -rf dist && npm run build && pm2 restart project-management-nest-api\""]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for completion; use || true so we always reach the output/status checks below
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'Status' \
            --output text)

          echo "Final SSM status: $STATUS"

          echo "--- STDOUT ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardOutputContent' \
            --output text

          echo "--- STDERR ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardErrorContent' \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi
